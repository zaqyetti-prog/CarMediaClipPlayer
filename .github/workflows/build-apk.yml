name: Build Car Clip Player APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle Oficial no Sistema
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Garantir permissões do gradlew ou gerar novo
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: 6. Compilar APK (Release e Debug)
        run: |
          ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease -x test --no-daemon --stacktrace

      - name: 7. Separar arquivos APK
        run: |
          mkdir -p apks-prontos
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} apks-prontos/ \;
          ls -la apks-prontos/

      - name: 8. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: CarClipPlayer-APK
          path: apks-prontos/*.apk
          retention-days: 30
